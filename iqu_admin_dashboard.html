<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: var(--font-sans);
  }
  :root {
    --navy: #1a3a5c;
    --blue: #1e5fa0;
    --gold: #c98a00;
    --soft: #f4f7fb;
    --green: #1a8a45;
    --orange: #d05a10;
    --purple: #5a3ab5;
    --text1: var(--color-text-primary);
    --text2: var(--color-text-secondary);
    --bg1: var(--color-background-primary);
    --bg2: var(--color-background-secondary);
    --bdr: var(--color-border-tertiary);
  }
  .wrap {
    padding: 16px;
    max-width: 100%;
    background: var(--bg2);
    min-height: 100vh;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-mark {
    width: 32px;
    height: 32px;
    background: #1a3a5c;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-mark svg {
    width: 18px;
    height: 18px;
  }
  .page-title {
    font-size: 17px;
    font-weight: 500;
    color: var(--text1);
  }
  .page-sub {
    font-size: 12px;
    color: var(--text2);
    margin-top: 1px;
  }
  .badge-live {
    background: #e6f5ec;
    color: #1a8a45;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    border: 0.5px solid #b0dfc0;
    font-weight: 500;
  }
  .tabs {
    display: flex;
    gap: 0;
    border: 0.5px solid var(--bdr);
    border-radius: var(--border-radius-md);
    overflow: hidden;
    background: var(--bg1);
  }
  .tab {
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    border: none;
    background: none;
    transition: background 0.15s;
  }
  .tab.active {
    background: var(--navy);
    color: #fff;
    font-weight: 500;
  }
  .tab:hover:not(.active) {
    background: var(--bg2);
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .metric {
    background: var(--bg1);
    border: 0.5px solid var(--bdr);
    border-radius: var(--border-radius-lg);
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .metric-accent {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0;
  }
  .metric-num {
    font-size: 26px;
    font-weight: 500;
    color: var(--text1);
    line-height: 1.1;
    margin-top: 2px;
  }
  .metric-lbl {
    font-size: 11px;
    color: var(--text2);
    margin-top: 4px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .metric-delta {
    font-size: 11px;
    margin-top: 6px;
  }
  .metric-delta.up {
    color: #1a8a45;
  }
  .metric-delta.down {
    color: #c0392b;
  }
  .section-row {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 12px;
    margin-bottom: 14px;
  }
  @media (max-width: 640px) {
    .section-row {
      grid-template-columns: 1fr;
    }
  }
  .card {
    background: var(--bg1);
    border: 0.5px solid var(--bdr);
    border-radius: var(--border-radius-lg);
    overflow: hidden;
  }
  .card-head {
    padding: 12px 16px;
    border-bottom: 0.5px solid var(--bdr);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-head-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text1);
  }
  .card-head-badge {
    font-size: 11px;
    color: var(--text2);
    background: var(--bg2);
    padding: 2px 8px;
    border-radius: 20px;
    border: 0.5px solid var(--bdr);
  }
  .bar-row {
    padding: 10px 16px;
    display: grid;
    grid-template-columns: 110px 1fr 38px;
    gap: 10px;
    align-items: center;
    border-bottom: 0.5px solid var(--bdr);
  }
  .bar-row:last-child {
    border-bottom: none;
  }
  .bar-lbl {
    font-size: 12px;
    color: var(--text1);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-lbl small {
    display: block;
    font-size: 10px;
    color: var(--text2);
    font-weight: 400;
  }
  .bar-track {
    background: var(--bg2);
    height: 6px;
    border-radius: 6px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.5s;
  }
  .bar-pct {
    font-size: 12px;
    color: var(--text2);
    text-align: right;
    font-weight: 500;
  }
  .status-pills {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .spill {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: var(--border-radius-md);
    border: 0.5px solid var(--bdr);
    cursor: pointer;
    transition: background 0.15s;
  }
  .spill:hover {
    background: var(--bg2);
  }
  .spill-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .spill-name {
    font-size: 13px;
    color: var(--text1);
    flex: 1;
    font-weight: 500;
  }
  .spill-count {
    font-size: 18px;
    font-weight: 500;
    color: var(--text1);
  }
  .spill-pct {
    font-size: 11px;
    color: var(--text2);
    margin-left: 4px;
  }
  .filter-bar {
    padding: 10px 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 8px;
  }
  .filter-bar input,
  .filter-bar select {
    height: 32px;
    border: 0.5px solid var(--bdr);
    border-radius: var(--border-radius-md);
    padding: 0 10px;
    font-size: 12px;
    background: var(--bg1);
    color: var(--text1);
    min-width: 0;
  }
  .filter-bar input {
    flex: 1;
    min-width: 160px;
  }
  .table-wrap {
    background: var(--bg1);
    border: 0.5px solid var(--bdr);
    border-radius: var(--border-radius-lg);
    overflow: hidden;
  }
  .tbl {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;
    font-size: 12px;
  }
  .tbl th {
    background: var(--bg2);
    padding: 9px 10px;
    color: var(--text2);
    font-weight: 500;
    text-align: left;
    border-bottom: 0.5px solid var(--bdr);
    white-space: nowrap;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .tbl td {
    padding: 9px 10px;
    border-bottom: 0.5px solid var(--bdr);
    color: var(--text1);
    vertical-align: middle;
  }
  .tbl tbody tr:last-child td {
    border-bottom: none;
  }
  .tbl tbody tr:hover td {
    background: var(--bg2);
  }
  .th-id {
    width: 48px;
  }
  .th-name {
    min-width: 120px;
  }
  .th-actions {
    width: 70px;
  }
  .chip {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  .chip-free {
    background: #e3effa;
    color: #1255a0;
  }
  .chip-l1 {
    background: #e3f0fb;
    color: #1a5fa0;
  }
  .chip-l2 {
    background: #fef3e0;
    color: #8a5200;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 500;
  }
  .status-badge::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.7;
  }
  .s-pending {
    background: #fff3e0;
    color: #c05a00;
  }
  .s-confirmed {
    background: #e6f5ec;
    color: #1a8a45;
  }
  .s-enrolled {
    background: #e8f0fe;
    color: #1a4fa0;
  }
  .s-cancelled {
    background: #fce8e8;
    color: #b03030;
  }
  .s-contacted {
    background: #f3e8fd;
    color: #6a2fa0;
  }
  .amt {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text1);
    font-weight: 500;
  }
  .amt-free {
    color: var(--text2);
    font-style: italic;
  }
  .wa-link {
    color: #1a8a45;
    font-family: var(--font-mono);
    font-size: 11px;
    text-decoration: none;
  }
  .wa-link:hover {
    text-decoration: underline;
  }
  .action-btn {
    padding: 3px 9px;
    font-size: 11px;
    border: 0.5px solid var(--bdr);
    border-radius: var(--border-radius-md);
    background: var(--bg1);
    color: var(--text1);
    cursor: pointer;
    transition: background 0.15s;

  .action-btn:hover {

  }
  .action-btn.view {
    color: #1a5fa0;
    border-color: #b0cff0;
  }
  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text2);
  }
  .pg-btns {
    display: flex;
    gap: 4px;
  }
  .pg-btn {
    padding: 3px 10px;
    border: 0.5px solid var(--bdr);
    border-radius: var(--border-radius-md);
    background: var(--bg1);
    cursor: pointer;
    font-size: 12px;
    color: var(--text1);
  }
  .pg-btn:hover {
    background: var(--bg2);
  }
  .pg-btn.active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }

    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 16px;
  }
  .modal-overlay.open {
    display: flex;
  }
  .modal {
    background: var(--bg1);
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--bdr);
    max-width: 600px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-head {
    padding: 14px 18px;
    border-bottom: 0.5px solid var(--bdr);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg1);
    z-index: 1;
  }
  .modal-head h3 {
    font-size: 15px;
    font-weight: 500;
    color: var(--text1);
  }
  .modal-close {
    border: none;
    background: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text2);
    line-height: 1;
  }
  .modal-body {
    padding: 18px;
  }
  .profile-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 0.5px solid var(--bdr);
  }
  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #dce8f6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;
    color: #1a5fa0;
    flex-shrink: 0;
  }
  .profile-name {
    font-size: 16px;
    font-weight: 500;
    color: var(--text1);
  }
  .profile-meta {
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border: 0.5px solid var(--bdr);
    border-radius: var(--border-radius-md);
    overflow: hidden;
  }
  .detail-item {
    padding: 9px 12px;
    border-bottom: 0.5px solid var(--bdr);
    border-right: 0.5px solid var(--bdr);
  }
  .detail-item:nth-child(even) {
    border-right: none;
  }
  .detail-item:nth-last-child(-n + 2) {
    border-bottom: none;
  }
  .detail-item.full {
    grid-column: 1/-1;
    border-right: none;
  }
  .detail-lbl {
    font-size: 10px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-weight: 500;
    margin-bottom: 3px;
  }
  .detail-val {
    font-size: 12px;
    color: var(--text1);
    font-weight: 500;
  }
  .section-title {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text2);
    margin: 14px 0 8px;
  }
  .chart-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  @media (max-width: 540px) {
    .chart-row {
      grid-template-columns: 1fr;
    }
    .detail-grid {
      grid-template-columns: 1fr;
    }
    .detail-item {
      border-right: none !important;
    }
  }
  .canvas-wrap {
    position: relative;
    height: 180px;
    width: 100%;
  }
</style>

  const BDT = { timeZone: "Asia/Dhaka" };
  function bdTime(iso) {
    const d = new Date(iso);
    const date = d.toLocaleDateString("en-BD", {
      ...BDT,
      day: "2-digit",
      month: "short",
      year: "numeric",
    });
    const time = d.toLocaleTimeString("en-BD", {
      ...BDT,
      hour: "numeric",
      minute: "2-digit",
      hour12: true,
    });
    return date + " " + time;
  }
  function bdDate(iso) {
    return new Date(iso).toLocaleDateString("en-BD", {

      day: "2-digit",
      month: "short",

  let filtered = [...DEMO];

  function typeLabel(t) {
    return t === "free"
      ? "Free"
      : t === "summer_level1"
        ? "Summer L1"
        : t === "summer_level2"
          ? "Summer L2"
          : t;
  }
  function typeChip(t) {
    const m = {
      free: "chip-free",
      summer_level1: "chip-l1",
      summer_level2: "chip-l2",
    };
    return `<span class="chip ${m[t] || ""}">${typeLabel(t)}</span>`;
  }
  function statusBadge(s) {
    const m = {
      pending: "s-pending",
      confirmed: "s-confirmed",
      enrolled: "s-enrolled",
      cancelled: "s-cancelled",
      contacted: "s-contacted",
    };
    return `<span class="status-badge ${m[s] || "s-pending"}">${s}</span>`;
  }
  function amountDisp(r) {
    if (r.form_type === "free")
      return `<span class="amt-free">Monthly plan</span>`;
    if (r.admission_fee === "complimentary")
      return `<span class="amt-free">Complimentary</span>`;
    if (r.payment_amount > 0)
      return `<span class="amt">$${r.payment_amount}</span>`;
    if (r.admission_fee === "flexible" || r.admission_fee)
      return `<span class="amt-free">${r.admission_fee}</span>`;
    return `<span class="amt-free">—</span>`;
  }
  function waLink(num) {
    if (!num)
      return `<span style="color:var(--color-text-secondary);font-size:11px">—</span>`;
    const clean = num.replace(/\D/g, "");
    return `<a class="wa-link" href="https://wa.me/${clean}" target="_blank">${num}</a>`;
  }
  function initials(r) {
    return (r.first_name[0] + (r.last_name[0] || "")).toUpperCase();
  }

  function renderMetrics() {
    const data =
      currentTab === "all"
        ? DEMO
        : DEMO.filter((r) => r.form_type === currentTab);
    const total = data.length;
    const enrolled = data.filter((r) => r.status === "enrolled").length;
    const revenue = data.reduce((s, r) => s + r.payment_amount, 0);
    const pending = data.filter((r) => r.status === "pending").length;
    const m = [
      {
        num: total,
        lbl: "Total registrations",
        color: "#1a5fa0",
        delta: "+3 this week",
        up: true,
      },
      {
        num: enrolled,
        lbl: "Enrolled",
        color: "#1a8a45",
        delta: `${Math.round((enrolled / total) * 100) || 0}% enrollment rate`,
        up: true,
      },
      {
        num: pending,
        lbl: "Pending review",
        color: "#c05a00",
        delta: "Needs follow-up",
        up: false,
      },
      {
        num: `$${revenue}`,
        lbl: "Revenue collected",
        color: "#5a3ab5",
        delta: "Zelle + Zeffy",
        up: true,
      },
    ];
    document.getElementById("metrics-row").innerHTML = m
      .map(
        (x) => `
    <div class="metric">
      <div class="metric-accent" style="background:${x.color}"></div>
      <div class="metric-num">${x.num}</div>
      <div class="metric-lbl">${x.lbl}</div>
      <div class="metric-delta ${x.up ? "up" : "down"}">${x.delta}</div>
    </div>`,
      )
      .join("");
  }

  function renderBars() {
    const data =
      currentTab === "all"
        ? DEMO
        : DEMO.filter((r) => r.form_type === currentTab);
    const total = data.length;
    document.getElementById("breakdown-total").textContent = total + " total";
    const types = [
      ["free", "Free Enrollment", "#1a5fa0"],
      ["summer_level1", "Summer Level 1", "#1a8a45"],
      ["summer_level2", "Summer Level 2", "#c98a00"],
    ];
    const bars = types.map(([t, label, color]) => {
      const cnt = data.filter((r) => r.form_type === t).length;
      const pct = total ? Math.round((cnt / total) * 100) : 0;
      return `<div class="bar-row">
      <div class="bar-lbl">${label}<small>${cnt} students</small></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="bar-pct">${pct}%</div>
    </div>`;
    });
    document.getElementById("bars-container").innerHTML = bars.join("");
  }

  function renderStatusPills() {
    const data =
      currentTab === "all"
        ? DEMO
        : DEMO.filter((r) => r.form_type === currentTab);
    const total = data.length;
    const statuses = [
      ["pending", "#c05a00"],
      ["confirmed", "#1a8a45"],
      ["enrolled", "#1a5fa0"],
      ["contacted", "#6a2fa0"],
      ["cancelled", "#b03030"],
    ];
    document.getElementById("status-pills").innerHTML = statuses
      .map(([s, c]) => {
        const cnt = data.filter((r) => r.status === s).length;
        const pct = total ? Math.round((cnt / total) * 100) : 0;
        return `<div class="spill" onclick="document.getElementById('statusFilter').value='${s}';applyFilter()">
      <div class="spill-dot" style="background:${c}"></div>
      <div class="spill-name">${s.charAt(0).toUpperCase() + s.slice(1)}</div>
      <div><span class="spill-count">${cnt}</span><span class="spill-pct">${pct}%</span></div>
    </div>`;
      })
      .join("");
  }

  function renderTable() {
    const start = (page - 1) * PER_PAGE;
    const pageData = filtered.slice(start, start + PER_PAGE);
    const getWA = (r) => r.whatsapp || r.guardian_whatsapp || "";
    document.getElementById("tbl-body").innerHTML = pageData
      .map(
        (r) => `
    <tr>
      <td style="color:var(--color-text-secondary);font-family:var(--font-mono);font-size:11px">#${r.id}</td>
      <td>
        <div style="font-weight:500;font-size:12px;color:var(--color-text-primary)">${r.first_name} ${r.last_name}</div>
        <div style="font-size:10px;color:var(--color-text-secondary)">${r.email}</div>
      </td>
      <td>${typeChip(r.form_type)}</td>
      <td>${waLink(getWA(r))}</td>
      <td>${amountDisp(r)}</td>
      <td>${statusBadge(r.status)}</td>
      <td style="font-size:11px;color:var(--color-text-secondary);white-space:nowrap">${bdTime(r.created_at)}</td>
      <td><button class="action-btn view" onclick="openModal(${r.id})">View</button></td>
    </tr>`,
      )
      .join("");
    const total = filtered.length;
    const totalPages = Math.ceil(total / PER_PAGE);
    document.getElementById("pg-info").textContent =
      `Showing ${start + 1}–${Math.min(start + PER_PAGE, total)} of ${total}`;
    let btns = "";
    for (let i = 1; i <= totalPages; i++)
      btns += `<button class="pg-btn ${i === page ? "active" : ""}" onclick="goPage(${i})">${i}</button>`;
    document.getElementById("pg-btns").innerHTML = btns;
  }

      <div class="detail-item"><div class="detail-lbl">Days / week</div><div class="detail-val">${r.days_per_week || "—"}</div></div>
      <div class="detail-item"><div class="detail-lbl">Time slot</div><div class="detail-val">${r.time_slot || "—"}</div></div>
      <div class="detail-item"><div class="detail-lbl">Session duration</div><div class="detail-val">${r.session_dur ? r.session_dur + " min" : "—"}</div></div>
      <div class="detail-item"><div class="detail-lbl">Teacher preference</div><div class="detail-val">${r.teacher_pref || "—"}</div></div>
      <div class="detail-item"><div class="detail-lbl">Device</div><div class="detail-val">${r.device || "—"}</div></div>
      <div class="detail-item"><div class="detail-lbl">Languages</div><div class="detail-val">${r.languages || "—"}</div></div>
      <div class="detail-item"><div class="detail-lbl">WA updates</div><div class="detail-val">${r.wa_updates || "—"}</div></div>
      <div class="detail-item full"><div class="detail-lbl">Memorized</div><div class="detail-val">${r.memorized || "—"}</div></div>
    </div>
    ${feeSection}
    ${paySection}
    <div class="section-title">Registration info</div>
    <div class="detail-grid">
      <div class="detail-item"><div class="detail-lbl">Referral source</div><div class="detail-val">${r.referral || "—"}</div></div>
      <div class="detail-item"><div class="detail-lbl">Submission time (BD)</div><div class="detail-val" style="font-size:11px">${bdTime(r.created_at)}</div></div>
      ${r.admin_note ? `<div class="detail-item full"><div class="detail-lbl">Admin note</div><div class="detail-val">${r.admin_note}</div></div>` : ""}
    </div>`;
    document.getElementById("modal").classList.add("open");
  }
  function closeModal() {
    document.getElementById("modal").classList.remove("open");
  }

  function switchTab(tab) {
    currentTab = tab;
    document
      .querySelectorAll(".tab")
      .forEach((t) => t.classList.remove("active"));
    event.target.classList.add("active");
    const typeF = document.getElementById("typeFilter");
    typeF.value = tab === "all" ? "" : tab;
    page = 1;
    applyFilter();
    renderMetrics();
    renderBars();
    renderStatusPills();
  }

  function applyFilter() {
    const s = document.getElementById("searchInput").value.toLowerCase();
    const st = document.getElementById("statusFilter").value;
    const tp = document.getElementById("typeFilter").value;
    filtered = DEMO.filter((r) => {
      const matchS =
        !s ||
        (
          r.first_name +
          " " +
          r.last_name +
          r.email +
          (r.whatsapp || r.guardian_whatsapp || "")
        )
          .toLowerCase()
          .includes(s);
      const matchSt = !st || r.status === st;
      const matchTp = !tp || r.form_type === tp;
      return matchS && matchSt && matchTp;
    });
    page = 1;
    renderTable();
  }
  function goPage(p) {
    page = p;
    renderTable();
  }

  renderMetrics();
  renderBars();
  renderStatusPills();
  applyFilter();
  setTimeout(renderCharts, 100);
</script>
